<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/src/assets/harvest-favicon.svg" />
    <title>HARVEST · FEEDBACK</title>
    <script>
      // Run before styles/React to avoid a flash of the wrong theme.
      try { document.documentElement.dataset.theme = localStorage.getItem('harvest-theme') === 'light' ? 'light' : 'dark'; } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
